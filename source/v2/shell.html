<meta charset="utf-8">
<title>W123 Run V2</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,400;0,500;0,600;1,400&family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
/* V2 — "instrument cluster". Day: Astral silver paint and anthracite ink. Night: the VDO gauge face.
   One loud element: the daylight gauge with its needle. Lamps (green / amber / red) only ever mean status. */
:root {
  --bg: #dfe2e1;          /* astral silver */
  --panel: #f4f5f3;       /* door-card light grey */
  --panel-2: #e9ecea;
  --ink: #22272b;         /* anthracite */
  --ink-2: #4d565d;
  --line: #c3c9c8;
  --needle: #e0521c;      /* gauge needle */
  --needle-ink: #ffffff;
  --lamp-ok: #2f8a4c;
  --lamp-watch: #c98a0c;
  --lamp-act: #c22f27;
  --lamp-off: #9aa3a6;
  --k-mw: #56636d; --k-main: #2e64b6; --k-scenic: #d48a14; --k-stop: #ffffff;
  --g-night: #2a3238; --g-tw: #6f8093; --g-day: #f1ead2;
  --stone: #ffffff; --stone-cap: #c22f27; --stone-ink: #22272b;
  --focus: #1d5fd1;
  --f-num: 'Barlow Condensed', 'Arial Narrow', sans-serif;
  --f-text: 'Barlow', system-ui, sans-serif;
  --r-sheet: 18px; --r-block: 10px; --r-chip: 6px;
  --tab-h: 64px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="day"]) { --dark: 1; } }
:root[data-theme="night"], :root[data-auto-night="1"]:not([data-theme="day"]) {
  --bg: #15181a; --panel: #1f2427; --panel-2: #272d31; --ink: #eef1f0; --ink-2: #a9b2b6; --line: #394146;
  --needle: #ff6a2a; --lamp-ok: #45b267; --lamp-watch: #e7a72a; --lamp-act: #ef4a3f; --lamp-off: #5d676c;
  --k-mw: #8995a0; --k-main: #5b8fe0; --k-scenic: #e9a23a; --k-stop: #dfe4e6;
  --g-night: #0c0f11; --g-tw: #3b4a5a; --g-day: #3b3a30;
  --stone: #eef1f0; --stone-cap: #ef4a3f; --stone-ink: #15181a; --focus: #8db4ff;
  color-scheme: dark;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="day"]) {
    --bg: #15181a; --panel: #1f2427; --panel-2: #272d31; --ink: #eef1f0; --ink-2: #a9b2b6; --line: #394146;
    --needle: #ff6a2a; --lamp-ok: #45b267; --lamp-watch: #e7a72a; --lamp-act: #ef4a3f; --lamp-off: #5d676c;
    --k-mw: #8995a0; --k-main: #5b8fe0; --k-scenic: #e9a23a; --k-stop: #dfe4e6;
    --g-night: #0c0f11; --g-tw: #3b4a5a; --g-day: #3b3a30;
    --stone: #eef1f0; --stone-cap: #ef4a3f; --stone-ink: #15181a; --focus: #8db4ff;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 400 17px/1.45 var(--f-text); }
a { color: inherit; }
button, select, input { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.num { font-family: var(--f-num); font-variant-numeric: tabular-nums; letter-spacing: .01em; }
[hidden] { display: none !important; }

/* shell */
.app { max-width: 720px; margin: 0 auto; padding: 0 16px calc(var(--tab-h) + 28px + env(safe-area-inset-bottom)); }
.top { display: flex; align-items: center; gap: 10px; padding: 14px 0 6px; }
.brand { font: 700 19px/1 var(--f-num); margin-right: auto; display: flex; align-items: center; gap: 8px; }
.brand svg { flex: none; }
.top select, .top .iconbtn { min-height: 40px; border: 1px solid var(--line); background: var(--panel); border-radius: var(--r-chip); padding: 0 10px; }
.iconbtn { display: inline-grid; place-items: center; min-width: 40px; cursor: pointer; }
.view { display: grid; gap: 14px; padding-top: 6px; }
.block { background: var(--panel); border-radius: var(--r-block); padding: 14px 16px; display: grid; gap: 10px; }
.block > h2, .block > h3 { margin: 0; }
h1 { font: 700 30px/1.08 var(--f-num); margin: 0; letter-spacing: .005em; }
h2 { font: 700 22px/1.15 var(--f-num); }
h3 { font: 600 19px/1.2 var(--f-num); }
.muted { color: var(--ink-2); }
.small { font-size: 15px; }
p { margin: 0; }

/* tab bar */
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; background: var(--panel); border-top: 1px solid var(--line);
  padding: 6px 10px calc(6px + env(safe-area-inset-bottom)); display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px; }
.tabbar > * { max-width: 100%; }
.tab { min-height: 52px; border: 0; background: none; border-radius: 10px; display: grid; justify-items: center; align-content: center; gap: 2px; font: 600 14px/1 var(--f-text); color: var(--ink-2); cursor: pointer; }
.tab svg { width: 22px; height: 22px; }
.tab span { max-width: 100%; padding: 0 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; letter-spacing: -0.01em; }
.rday { scroll-margin-top: 12px; }
.seg3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); background: var(--panel-2); border-radius: 10px; padding: 3px; gap: 3px; margin: 4px 0 12px; }
.seg3 button { min-height: 44px; border: 0; border-radius: 8px; background: none; font: 600 15px/1.1 var(--f-text); color: var(--ink-2); cursor: pointer; padding: 4px 2px; }
.seg3 button[aria-pressed="true"] { background: var(--panel); color: var(--ink); box-shadow: 0 1px 2px #0003; }
.rcat { padding-top: 6px; padding-bottom: 6px; }
.rcat > summary { list-style: none; display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 12px; align-items: center; min-height: 64px; cursor: pointer; }
.rcat > summary::-webkit-details-marker { display: none; }
.rcat > summary b { font: 700 22px/1.15 var(--f-num); }
.rcat[open] > summary { border-bottom: 1px solid var(--line); margin-bottom: 4px; }
.rcount { font: 600 15px var(--f-num); color: var(--ink-2); }
.rcat .cc { display: inline-block; min-width: 30px; padding: 2px 5px; margin-right: 4px; border-radius: 4px; background: var(--k-main); color: #fff; text-align: center; font: 700 13px/1.2 var(--f-num); vertical-align: 1px; }
.cc.all { background: var(--ink-2); }
.tab[aria-current="page"] { color: var(--ink); background: var(--panel-2); }
.tab.rec { background: var(--needle); color: var(--needle-ink); }
@media (min-width: 760px) { .tabbar { left: 50%; transform: translateX(-50%); max-width: 720px; border: 1px solid var(--line); border-bottom: 0; border-radius: 14px 14px 0 0; } }

/* kilometre stone (day number) */
.stone { flex: none; width: 40px; height: 46px; border-radius: 9px 9px 4px 4px; background: var(--stone); color: var(--stone-ink); display: grid; place-items: end center;
  padding-bottom: 4px; font: 700 22px/1 var(--f-num); position: relative; box-shadow: inset 0 0 0 1px #0002; overflow: hidden; }
.stone::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 15px; background: var(--stone-cap); }
.stone.lg { width: 52px; height: 60px; font-size: 30px; }
.stone.lg::before { height: 19px; }
.stone.rest::before { background: var(--lamp-off); }

/* lamps */
.lamp { flex: none; width: 14px; height: 14px; border-radius: 50%; background: var(--lamp-off); box-shadow: 0 0 0 3px color-mix(in srgb, currentColor 0%, transparent); }
.lamp.ok { background: var(--lamp-ok); } .lamp.watch { background: var(--lamp-watch); } .lamp.act { background: var(--lamp-act); }
.lamp.on.ok { box-shadow: 0 0 10px var(--lamp-ok); } .lamp.on.watch { box-shadow: 0 0 10px var(--lamp-watch); } .lamp.on.act { box-shadow: 0 0 10px var(--lamp-act); }
.lamps { display: grid; gap: 2px; }
.lrow { display: grid; grid-template-columns: 14px minmax(0, 1fr); gap: 12px; align-items: start; padding: 10px 0; border-top: 1px solid var(--line); }
.lrow:first-child { border-top: 0; }
.lrow .lamp { margin-top: 5px; }
.lrow b { font-weight: 600; }
.lrow a, .lrow button.link { font-weight: 600; }

/* day header */
.dhead { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 14px; align-items: center; }
.dhead .when { font-size: 15px; color: var(--ink-2); }
.dhead h1 { overflow-wrap: anywhere; }
.stepper { display: flex; gap: 8px; align-items: center; }
.stepper button { min-height: 44px; min-width: 44px; border: 1px solid var(--line); background: var(--panel); border-radius: var(--r-chip); cursor: pointer; font-size: 18px; }
.stepper .label { flex: 1; font-size: 15px; color: var(--ink-2); }
.note { font-size: 15px; color: var(--ink-2); }

/* the daylight gauge */
.gauge { display: grid; gap: 4px; }
.gface { position: relative; height: 54px; border-radius: 12px; overflow: hidden; background: var(--g-night); box-shadow: inset 0 0 0 1px #0003; }
.gface i { position: absolute; top: 0; bottom: 0; }
.gface .n { background: var(--g-night); } .gface .tw { background: var(--g-tw); } .gface .dy { background: var(--g-day); }
.gface .seg { top: 16px; bottom: 16px; border-radius: 4px; }
.gface .k-mw { background: var(--k-mw); } .gface .k-main { background: var(--k-main); } .gface .k-scenic { background: var(--k-scenic); }
.gface .k-stop { background: transparent; box-shadow: inset 0 0 0 2px var(--k-mw); top: 20px; bottom: 20px; }
.gface .needle { width: 3px; margin-left: -1.5px; background: var(--needle); top: -2px; bottom: -2px; box-shadow: 0 0 0 1px #0004; z-index: 2; }
.gface .needle::after { content: ""; position: absolute; left: -5px; top: 0; border: 6.5px solid transparent; border-top: 8px solid var(--needle); }
.gticks { position: relative; height: 18px; font: 500 14px/18px var(--f-num); color: var(--ink-2); }
.gticks span { position: absolute; transform: translateX(-50%); white-space: nowrap; }
.gsun { display: grid; grid-template-columns: repeat(3, auto); justify-content: space-between; gap: 4px 10px; font-size: 15px; color: var(--ink-2); }
.gsun span { display: grid; }
.gsun b { font: 600 17px var(--f-num); color: var(--ink); }

/* next step */
.next { display: grid; gap: 10px; }
.next .kicker { font-size: 15px; color: var(--ink-2); }
.next .big { font: 700 44px/1 var(--f-num); }
.next .what { font: 600 22px/1.15 var(--f-num); }
.next .how { font-size: 15px; color: var(--ink-2); }
.btnrow { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.btn { min-height: 52px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel-2); display: grid; place-items: center; text-align: center; padding: 6px 12px;
  font: 600 17px/1.15 var(--f-text); text-decoration: none; cursor: pointer; }
.btn.primary { background: var(--ink); color: var(--panel); border-color: var(--ink); }
.btn.rec { background: var(--needle); color: var(--needle-ink); border: 0; font: 700 21px/1 var(--f-num); letter-spacing: .02em; min-height: 62px; display: flex; justify-content: center; align-items: center; gap: 10px; }
button.link { border: 0; background: none; padding: 0; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; min-height: 32px; }
.btn.wide { grid-column: 1 / -1; }
.btn:disabled { opacity: .55; }
.recline { font-size: 15px; color: var(--ink-2); }
.auto select { min-height: 44px; border: 1px solid var(--line); border-radius: var(--r-chip); background: var(--panel); padding: 0 8px; }
.auto { display: flex; gap: 8px; align-items: center; font-size: 15px; color: var(--ink-2); flex-wrap: wrap; }

/* route style */
.seg4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); background: var(--panel-2); border-radius: 10px; padding: 3px; gap: 3px; }
.seg4 button { min-height: 44px; border: 0; border-radius: 8px; background: none; font: 600 15px/1.1 var(--f-text); color: var(--ink-2); cursor: pointer; padding: 4px 2px; }
.seg4 button[aria-pressed="true"] { background: var(--panel); color: var(--ink); box-shadow: 0 1px 2px #0003; }
.seg4 button.same { color: color-mix(in srgb, var(--ink-2) 70%, transparent); }
.stylenote { font-size: 15px; color: var(--ink-2); }
.chip { display: inline-flex; align-items: center; gap: 6px; min-height: 36px; padding: 0 12px; border-radius: 18px; border: 1px solid var(--line); background: var(--panel); font: 600 15px var(--f-text); cursor: pointer; }

/* stats */
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.stats div { display: grid; }
.stats b { font: 700 26px/1.05 var(--f-num); font-variant-numeric: tabular-nums; }
.stats span { font-size: 14px; color: var(--ink-2); }
@media (max-width: 380px) { .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

/* days list */
.dlist { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.drow { width: 100%; text-align: left; border: 0; background: var(--panel); border-radius: var(--r-block); padding: 10px 14px; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 14px; align-items: center; cursor: pointer; min-height: 66px; }
.drow .t { font: 600 19px/1.15 var(--f-num); overflow-wrap: anywhere; }
.drow .s { font-size: 14px; color: var(--ink-2); }
.drow .r { display: grid; justify-items: end; gap: 4px; }
.drow .r b { font: 600 18px var(--f-num); }
.drow.today { box-shadow: inset 0 0 0 2px var(--needle); }

/* day tabs */
.hero { margin: 0 -16px; aspect-ratio: 16 / 8; background: var(--panel-2) center / cover no-repeat; position: relative; }
@media (min-width: 760px) { .hero { margin: 0; border-radius: var(--r-block); } }
.hero button { position: absolute; inset: 0; width: 100%; border: 0; background: none; cursor: zoom-in; }
.dtabs { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--bg); z-index: 5; }
.dtabs button { min-height: 48px; border: 0; background: none; font: 600 16px var(--f-text); color: var(--ink-2); border-bottom: 3px solid transparent; cursor: pointer; }
.dtabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--needle); }

/* timeline */
.tl { list-style: none; margin: 0; padding: 0; }
.tl li { display: grid; grid-template-columns: 58px minmax(0, 1fr); gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); }
.tl li:first-child { border-top: 0; }
.tl .tt { font: 700 21px/1.1 var(--f-num); font-variant-numeric: tabular-nums; }
.tl .drive .tt { color: var(--needle); }
.tl b { font-weight: 600; }
.tl .meta { font-size: 15px; color: var(--ink-2); }
.tl .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; align-items: center; }
.tag { line-height: 1.35; }
.tag { font-size: 13.5px; padding: 2px 8px; border-radius: 4px; background: var(--panel-2); color: var(--ink-2); }
.tag.warn { background: color-mix(in srgb, var(--lamp-act) 16%, var(--panel)); color: var(--ink); }
.tag.gold { background: color-mix(in srgb, var(--k-scenic) 22%, var(--panel)); color: var(--ink); }
.tag.opt { background: none; box-shadow: inset 0 0 0 1px var(--line); }
.tag.must { background: var(--ink); color: var(--panel); }
.tl .stop .tt { color: var(--ink-2); }
.tl .end .tt { color: var(--ink-2); }

/* stops */
.stops { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.stop { display: grid; grid-template-columns: 76px minmax(0, 1fr); gap: 12px; align-items: start; }
.stop .ph { width: 76px; height: 76px; border-radius: 8px; background: var(--panel-2) center / cover; border: 0; padding: 0; cursor: zoom-in; }
.stop .ph.none { display: grid; place-items: center; color: var(--ink-2); cursor: default; }
.stop .nm { font: 600 19px/1.15 var(--f-num); }
.stop .kind { font-size: 14px; color: var(--ink-2); }
.stop .nt { font-size: 15.5px; }
.links { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
.links a { min-height: 40px; display: inline-flex; align-items: center; padding: 0 12px; border-radius: 8px; border: 1px solid var(--line); text-decoration: none; font: 600 15px var(--f-text); background: var(--panel); }
.strip { display: grid; grid-auto-flow: column; grid-auto-columns: 132px; gap: 8px; overflow-x: auto; padding-bottom: 6px; scroll-snap-type: x mandatory; }
.strip button { border: 0; padding: 0; background: none; text-align: left; scroll-snap-align: start; cursor: zoom-in; }
.strip .tile { display: block; width: 132px; height: 99px; border-radius: 8px; background-repeat: no-repeat; }
.strip small { display: block; font-size: 13px; color: var(--ink-2); margin-top: 3px; }
.park { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.park li { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 10px; }
.park .pb { width: 34px; height: 34px; border-radius: 6px; background: var(--k-main); color: #fff; display: grid; place-items: center; font: 700 16px var(--f-num); }
.park .pb.pull { background: var(--k-scenic); color: var(--ink); }

/* weather + news (V1 fragments, restyled) */
.wx-slot { display: grid; gap: 12px; }
.wx-slot > h3 { display: none; }
.wx-verdict { border-radius: var(--r-block); padding: 12px 14px; display: grid; gap: 6px; border-left: 6px solid var(--lamp-off); background: var(--panel-2); }
.wx-verdict p { margin: 0; }
.wx-verdict.v-ok { border-left-color: var(--lamp-ok); } .wx-verdict.v-watch { border-left-color: var(--lamp-watch); }
.wx-verdict.v-switch, .wx-verdict.v-wait { border-left-color: var(--lamp-act); }
.wx-verdict button, .wx-adv button { justify-self: start; min-height: 46px; padding: 0 16px; border-radius: 10px; border: 0; background: var(--ink); color: var(--panel); font: 600 16px var(--f-text); cursor: pointer; }
.wx-fc { display: grid; gap: 8px; }
.wx-fc.test { border-left: 3px dashed var(--line); padding-left: 10px; }
.bul-head { display: grid; gap: 2px; font-size: 14px; color: var(--ink-2); }
.bul-head b { color: var(--ink); font: 600 17px var(--f-num); }
.bwx-wrap { overflow-x: auto; }
.bwx { border-collapse: collapse; font-size: 14.5px; min-width: 100%; }
.bwx th, .bwx td { text-align: left; padding: 6px 8px 6px 0; border-bottom: 1px solid var(--line); white-space: nowrap; }
.bwx th { font-weight: 600; color: var(--ink-2); }
.wx-legs, .wx-hot, .bul-items { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.wx-legs li, .wx-hot li { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 10px; font-size: 15.5px; border-left: 4px solid var(--lamp-off); padding-left: 10px; }
.wx-legs li.r-ok, .wx-hot li.h-ok { border-left-color: var(--lamp-ok); }
.wx-legs li.r-watch, .wx-hot li.h-watch { border-left-color: var(--lamp-watch); }
.wx-legs li.r-warn, .wx-hot li.h-switch, .wx-hot li.h-wait { border-left-color: var(--lamp-act); }
.wx-t { font: 600 17px var(--f-num); font-variant-numeric: tabular-nums; white-space: nowrap; }
.wx-hot .hlev { margin-left: 6px; font: 600 14px var(--f-num); color: var(--ink-2); }
.wx-hot small, .wx-avoid, .wmsg { color: var(--ink-2); font-size: 14.5px; }
.wx-slot h4 { margin: 4px 0 0; font: 600 18px var(--f-num); }
.wx-clim ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; font-size: 15.5px; }
.wx-num { font-family: var(--f-num); font-weight: 600; }
.bul-items li { display: grid; grid-template-columns: 86px minmax(0, 1fr); gap: 10px; border-left: 4px solid var(--lamp-off); padding-left: 10px; font-size: 15.5px; }
.bul-items li.sev-watch { border-left-color: var(--lamp-watch); } .bul-items li.sev-warn { border-left-color: var(--lamp-act); }
.bcat { font: 600 15px var(--f-num); color: var(--ink-2); }
.bul-day { display: grid; gap: 10px; }
.bul-empty { color: var(--ink-2); }

/* live details (V1 fragment) */
.live-detail { display: grid; gap: 10px; }
.wbig { font: 700 24px/1.1 var(--f-num); }
.wbig.late { color: var(--lamp-act); }
.wstat { display: grid; grid-template-columns: repeat(auto-fit, minmax(96px, 1fr)); gap: 10px; }
.wstat .num { font: 700 22px/1.1 var(--f-num); display: grid; }
.wstat small { font: 400 13.5px var(--f-text); color: var(--ink-2); }
.wtips { margin: 0; padding-left: 20px; display: grid; gap: 4px; font-size: 15.5px; }
.opts { display: grid; gap: 8px; }
.opts h4 { margin: 0; font: 600 18px var(--f-num); }
.opt { background: var(--panel-2); border-radius: 8px; padding: 10px 12px; display: grid; gap: 4px; font-size: 15px; }
.opt.cur { box-shadow: inset 0 0 0 2px var(--ink-2); }
.opt .oh { display: flex; justify-content: space-between; gap: 8px; }
.opt .oh b { font: 600 18px var(--f-num); }
